[pytest]
testpaths = tests
pythonpath = . tests
addopts = -v --html=reports/report.html --self-contained-html
markers =
    security: testes de segurança (prompt injection, vazamento de dados, PII)
    unit: testes unitários das proteções (guardrails)
    quality: testes de qualidade (escopo, transferência para humano, falsos positivos)
